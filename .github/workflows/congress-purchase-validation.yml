name: Congressional purchase validation

on:
  push:
    branches: [vibe-lda-ingestion]
    paths:
      - '.github/workflows/congress-purchase-validation.yml'
      - 'signals/fetch_congress_stock_trades.py'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch 2025 congressional trades
        run: |
          python signals/fetch_congress_stock_trades.py \
            --base-url https://regs.datadawn.org \
            --database openregs \
            --year 2025 \
            --out /tmp/congress_stock_trades_2025.csv
      - name: QC extract
        run: python signals/audit_congress_stock_trade_extract.py /tmp/congress_stock_trades_2025.csv --year 2025
      - name: Build frozen policy purchase panel
        run: |
          python signals/build_congress_purchase_validation_panel.py \
            --trades /tmp/congress_stock_trades_2025.csv \
            --exposure-map signals/congress_trade_policy_exposure_map_v1.csv \
            --year 2025 \
            --out /tmp/congress_policy_purchase_panel_2025.csv
      - uses: actions/upload-artifact@v4
        with:
          name: congress-purchase-validation-2025
          path: |
            /tmp/congress_stock_trades_2025.csv
            /tmp/congress_policy_purchase_panel_2025.csv
          retention-days: 30
