name: Congress resolver tests

on:
  push:
    branches: [vibe-lda-ingestion]
    paths:
      - 'sources/congress/**'
      - 'requirements.txt'
      - '.github/workflows/congress-resolver-tests.yml'
  pull_request:
    paths:
      - 'sources/congress/**'
      - 'requirements.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Run Congress resolver regression suite
        run: |
          python -m unittest \
            sources.congress.test_resolution \
            sources.congress.test_resolve_bills_transition \
            sources.congress.test_export_validated_bill_targets \
            sources.congress.test_reference_normalization
